<div class="h-screen overflow-y-scroll grid grid-cols-2 md:grid-cols-4 gap-4 pt-5"
  (scroll)="onScroll($event)"
  #groupDiv
>
  @for (gifsgroup of gifService.trendingGifGroup(); track gifsgroup) {
    <div class="grid gap-4">
      @for (gif of gifsgroup; track gif.id) {
        <div>
            <img class="h-auto max-w-full rounded-base" [src]="gif.url" [alt]="gif.title">
        </div>
      }
    </div>
  }
</div>
